name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,schema]"

      - name: Lint
        run: ruff check src tests

      - name: Format check
        run: ruff format --check src tests

      - name: Type check
        run: mypy

      - name: Test
        run: pytest --cov --cov-report=term-missing --cov-fail-under=80

  validate-agent-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install -e .

      - name: Validate the Genie configuration
        # Fails the build on a two-level identifier, an attached base table, an
        # example query that reads unreviewed claims, or missing refusal rules.
        run: python scripts/validate_config.py

      - name: Check the committed config is current
        run: |
          python scripts/generate_config.py --out /tmp/research-agent.json
          diff -u genie/research-agent.json /tmp/research-agent.json \
            || { echo "::error::genie/research-agent.json is stale; run scripts/generate_config.py"; exit 1; }

  validate-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@main
      - name: Validate the bundle
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: databricks bundle validate -t dev
